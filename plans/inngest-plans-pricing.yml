  - Workflows
description: >-
  Machine-readable plans and pricing for Inngest, aligned to the platform's
  published Hobby, Pro, and Enterprise tiers. Execution-priced with the first
  50,000 executions free every month across all plans.
plans:
  - id: inngest-hobby
    name: Hobby
    type: freemium
    description: >-
      Free tier intended for prototyping and low-volume integrations.
      Includes 50,000 executions per month, 5 concurrent steps, 3 users,
      24-hour trace retention, and unlimited staging environments.
    entries:
      - label: Included Executions
        description: Monthly included executions across all functions
        name: executions
        type: quota
        metric: executions
        limit: 50000
        timeFrame: month
        geo: global
        domains:
          - https://api.inngest.com
          - https://inn.gs
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Concurrent Steps
        description: Maximum concurrent step executions on the Hobby tier
        name: concurrent_steps
        type: quota
        metric: concurrent_steps
        limit: 5
        timeFrame: instant
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Trace Retention
        description: Retention window for run traces
        name: trace_retention_hours
        type: quota
        metric: hours
        limit: 24
        timeFrame: rolling
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Seats
        description: Included team seats
        name: seats
        type: quota
        metric: users
        limit: 3
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Inngest Cloud
      - name: Dev Server
      - name: Unlimited Staging / Branch Environments
      - name: Basic Observability And Alerting
      - name: Community Support
      - name: Inngest REST API
  - id: inngest-pro
    name: Pro
    type: paid
    description: >-
      Production tier for teams. Starts at $75/month, includes 1,000,000
      executions (scalable up to ~20M via add-ons), 100+ concurrent steps,
      15+ users, 7-day trace retention, and granular metrics.
    entries:
      - label: Base Subscription
        description: Monthly Pro subscription
        name: subscription
        type: license
        metric: month
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: '75.00'
        userMultiplied: false
      - label: Included Executions
        description: Monthly included executions on Pro
        name: executions
        type: quota
        metric: executions
        limit: 1000000
        timeFrame: month
        geo: global
        domains:
          - https://api.inngest.com
          - https://inn.gs
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Execution Overage (1M–5M)
        description: Per-execution price after the included pool, in the 1M–5M band
        name: execution_overage_tier1
        type: metered
        metric: executions
        limit: 5000000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.000050'
        userMultiplied: false
      - label: Max Add-On Executions
        description: Maximum executions reachable via Pro add-ons
        name: executions_addon_ceiling
        type: quota
        metric: executions
        limit: 20000000
        timeFrame: month
        geo: global
        unit: 1
        price: TBD
        userMultiplied: false
      - label: Concurrent Steps
        description: Concurrent step ceiling on Pro
        name: concurrent_steps
        type: quota
        metric: concurrent_steps
        limit: 100
        timeFrame: instant
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Trace Retention
        description: Retention window for run traces on Pro
        name: trace_retention_days
        type: quota
        metric: days
        limit: 7
        timeFrame: rolling
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Seats
        description: Included team seats on Pro
        name: seats
        type: quota
        metric: users
        limit: 15
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: All Hobby Features
      - name: Granular Metrics
      - name: Higher Concurrency And Throughput
      - name: Webhook Subscriptions
      - name: Inngest REST API
  - id: inngest-enterprise
    name: Enterprise
    type: enterprise
    description: >-
      Custom-negotiated tier for large-scale and regulated workloads. Custom
      execution volume, concurrent step ceilings from 500 up to 50,000,
      custom seats, 90-day trace retention, SAML/RBAC, audit trails, and
      dedicated support.
    entries:
      - label: Executions
        description: Negotiated monthly execution volume; -1 indicates custom-negotiated
        name: executions
        type: quota
        metric: executions
        limit: -1
        timeFrame: month
        geo: configurable
        domains:
          - https://api.inngest.com
          - https://inn.gs
        unit: 1
        price: custom
        userMultiplied: false
      - label: Concurrent Steps Range
        description: Negotiated concurrent step ceiling (500 – 50,000)
        name: concurrent_steps_ceiling
        type: quota
        metric: concurrent_steps
        limit: 50000
        timeFrame: instant
        geo: configurable
        unit: 1
        price: custom
        userMultiplied: false
      - label: Trace Retention
        description: Retention window for run traces on Enterprise
        name: trace_retention_days
        type: quota
        metric: days
        limit: 90
        timeFrame: rolling
        geo: configurable
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: All Pro Features
      - name: SAML SSO And RBAC
      - name: Audit Trails
      - name: Exportable Observability
      - name: Dedicated Support
      - name: Contractual SLA
      - name: Security And Compliance Review
      - name: Inngest REST API
