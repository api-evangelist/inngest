      - Runs
      - Apps
      - Environments
      - Webhooks
      - Keys
      - Account
    serviceName: Inngest REST API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Executions
    metric: billed_cost / (executions / 1000)
    target: TBD
  - name: Cost per Active App
    metric: billed_cost / active_apps
    target: TBD
  - name: Cost per AI Step Call
    metric: billed_cost_ai / ai_step_calls
    target: TBD
