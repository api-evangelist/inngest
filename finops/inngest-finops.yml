description: >-
  FinOps framework definition for the Inngest event-driven durable execution
  platform. Aligns Inngest's execution-priced business model (Hobby / Pro /
  Enterprise) to FOCUS-style cost allocation, usage measurement, and unit
  economics, covering events, runs, steps, traces, and AI step calls.
principles:
  - name: Visibility
    description: >-
      Make execution and step-level usage visible to engineering, product, and
      finance teams via Insights (Events, Runs, Steps, Trace Spans datasources)
      and Granular Metrics on Pro.
  - name: Allocation
    description: >-
      Tag every billable execution with the consuming team, environment, app,
      function, and feature so cost can be allocated by branch/environment and
      tenant.
  - name: Optimization
    description: >-
      Continuously evaluate concurrency, throttling, batching, debounce,
      singleton, and step memoization to reduce executions per useful unit
      of work.
  - name: Accountability
    description: >-
      Establish budget owners and chargeback/showback flows per app and per
      environment.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
  baseFees:
    - name: Pro Subscription
      amount: '75.00'
      currency: USD
      frequency: Monthly
  includedAllowances:
    - name: First 50K Executions
      description: >-
        First 50,000 executions per month are included free on every plan.
      limit: 50000
      unit: executions
focusColumns:
  ServiceName: Inngest
  ServiceCategory: Developer Tools / Workflow Orchestration
  ProviderName: Inngest
  PublisherName: Inngest
  InvoiceIssuerName: Inngest
  PricingCategory: Usage-Based
  PricingUnit: execution
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: executions
    description: Billable function executions (each invocation of a function or step counts toward the meter)
    unit: execution
    aggregation: sum
    dimensions:
      - app
      - function
      - environment
      - tier
      - consumer
  - name: ai_step_calls
    description: AI step calls via step.ai.wrap and step.ai.infer
    unit: call
    aggregation: sum
    dimensions:
      - app
      - function
      - model
      - provider
  - name: concurrent_steps
    description: Concurrent steps in flight per account
    unit: step
    aggregation: max
    dimensions:
      - environment
      - tier
  - name: trace_retention_days
    description: Number of days run traces are retained
    unit: day
    aggregation: max
    dimensions:
      - tier
apis:
  - name: Inngest REST API
    baseURL: https://api.inngest.com
    tags:
