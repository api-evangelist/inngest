apis:
  - aid: inngest:rest-api
    name: Inngest REST API
    description: >-
      The Inngest REST API spans two surfaces. v1 covers event ingestion (/e/{eventKey} and inn.gs), event listing, and
      run inspection (status, jobs, cancel). v2 covers account, environments, apps (sync), function invocation,
      webhooks, keys (event + signing), canonical run summaries, and OpenTelemetry-style trace trees. Authenticated
      calls use a signing-key bearer token.
    humanURL: https://www.inngest.com/docs/reference/rest-api
    baseURL: https://api.inngest.com
