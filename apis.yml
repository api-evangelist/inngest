aid: inngest
name: Inngest
segments:
  - Workflows
description: >-
  Inngest is an event-driven durable execution platform for background jobs, step functions, scheduled workflows, and AI
  agent orchestration. It exposes a v1 event ingestion and run inspection API, a v2 management API (accounts,
  environments, apps, webhooks, keys, function invocation, runs, traces), official SDKs for TypeScript, Python, Go, and
  Kotlin, AgentKit for multi-agent systems, Connect for persistent worker connections, Realtime streaming, Signals,
  Durable Endpoints, Insights (SQL over events and runs), and a heavily-marketed local Dev Server CLI.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/inngest.png
tags:
  - AI Agents
  - AgentKit
  - Background Jobs
  - Connect
  - Cron Jobs
  - Dev Server
