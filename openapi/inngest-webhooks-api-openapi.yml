openapi: 3.2.0
info:
  description: The v2 API delivers a significantly improved developer experience with consistent design patterns and enhanced functionality.
  title: Inngest REST API v2 Webhooks API
  version: 2.0.0
servers:
- description: Production server
  url: https://api.inngest.com/v2
- description: Development server
  url: http://localhost:8288/api/v2
tags:
- description: Create and manage inbound webhooks
  name: Webhooks
paths:
  /env/webhooks:
    get:
      description: Lists all webhooks in the specified environment
      operationId: V2_ListWebhooks
      parameters:
      - description: Pagination cursor from previous response
        in: query
        name: cursor
        schema:
          type: string
      - description: 'Number of webhooks to return per page (min: 1, max: 100)'
        in: query
        name: limit
        schema:
          default: '20'
          format: int32
          type: integer
      - description: Target environment for the webhooks (e.g., 'production', 'staging', 'development')
        in: header
        name: X-Inngest-Env
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ListWebhooksResponse'
          description: List of webhooks
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Bad Request - invalid query parameters
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Unauthorized - authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Forbidden - insufficient permissions
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List webhooks
      tags:
      - Webhooks
    post:
      description: Creates a new webhook for receiving events
      operationId: V2_CreateWebhook
      parameters:
      - description: Target environment for the webhook (e.g., 'production', 'staging', 'development')
        in: header
        name: X-Inngest-Env
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2CreateWebhookRequest'
        required: true
        x-originalParamName: body
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2CreateWebhookResponse'
          description: Webhook successfully created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Bad Request - invalid input data
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Unauthorized - authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Forbidden - insufficient permissions
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Conflict - webhook with same URL already exists
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Unprocessable Entity - business logic validation failed
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create webhook
      tags:
      - Webhooks
components:
  schemas:
    v2CreateWebhookResponse:
      properties:
        data:
          $ref: '#/components/schemas/v2Webhook'
        metadata:
          $ref: '#/components/schemas/v2ResponseMetadata'
      type: object
    v2ListWebhooksResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/v2Webhook'
          type: array
        metadata:
          $ref: '#/components/schemas/v2ResponseMetadata'
        page:
          $ref: '#/components/schemas/v2Page'
      type: object
    v2Webhook:
      properties:
        createdAt:
          format: date-time
          type: string
        environment:
          type: string
        eventFilter:
          $ref: '#/components/schemas/v2EventFilter'
        id:
          type: string
        name:
          type: string
        response:
          type: string
        transform:
          type: string
        updatedAt:
          format: date-time
          type: string
        url:
          type: string
      type: object
    v2ErrorResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/v2Error'
          type: array
      type: object
    v2FilterType:
      default: ALLOW
      enum:
      - ALLOW
      - DENY
      type: string
    v2ResponseMetadata:
      properties:
        cachedUntil:
          format: date-time
          type: string
        fetchedAt:
          format: date-time
          type: string
        timeRange:
          $ref: '#/components/schemas/v2TimeRange'
      type: object
    v2Error:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    v2Page:
      properties:
        cursor:
          type: string
        hasMore:
          type: boolean
        limit:
          format: int32
          type: integer
      type: object
    v2EventFilter:
      properties:
        events:
          description: Allow or deny specific events, e.g. 'orders/payment.created', or 'orders/*' for all orders. Only events in this list will be either allowed or denied.
          example:
          - orders/payment.created
          - orders/*
          items:
            type: string
          type: array
        filter:
          $ref: '#/components/schemas/v2FilterType'
      type: object
    v2TimeRange:
      properties:
        from:
          format: date-time
          type: string
        until:
          format: date-time
          type: string
      type: object
    v2CreateWebhookRequest:
      properties:
        eventFilter:
          $ref: '#/components/schemas/v2EventFilter'
        name:
          description: Descriptive name for the webhook
          example: Payment Processing Webhook
          type: string
        response:
          description: Optional inline JS function which is called to respond to GET requests
          example: 'function respond(body, headers) { return { status: 200, headers: {}, body: JSON.parse(body)?.challenge } };'
          type: string
        transform:
          description: The inline JS transform function for incoming events
          example: 'function transform(evt, headers = {}, queryParams = {}, raw = '''') { return { name: ''webhook/request.received'', data: evt }; }'
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Bearer token authentication. Format: `Bearer {key}`'
      in: header
      name: Authorization
      type: apiKey
x-provenance:
  method: harvested
  publisher: Inngest
  source: https://api-docs.inngest.com/api-specs/v2.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
