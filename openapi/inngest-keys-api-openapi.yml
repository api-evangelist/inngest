openapi: 3.2.0
info:
  description: The v2 API delivers a significantly improved developer experience with consistent design patterns and enhanced functionality.
  title: Inngest REST API v2 Keys API
  version: 2.0.0
servers:
- description: Production server
  url: https://api.inngest.com/v2
- description: Development server
  url: http://localhost:8288/api/v2
tags:
- description: Manage event and signing keys
  name: Keys
paths:
  /keys/events:
    get:
      description: Lists event keys for a specific account, optionally filtered by environment. If the environment header isn't specified, this returns the default production environment's keys.
      operationId: V2_FetchAccountEventKeys
      parameters:
      - description: Pagination cursor from previous response
        in: query
        name: cursor
        schema:
          type: string
      - description: 'Number of event keys to return per page (min: 1, max: 100)'
        in: query
        name: limit
        schema:
          default: '20'
          format: int32
          type: integer
      - description: Filter event keys by environment (e.g., 'production', 'staging', 'development')
        in: header
        name: X-Inngest-Env
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                    - createdAt: '2024-01-15T10:30:00Z'
                      environment: production
                      id: d4e5f6a7-b8c9-4012-def4-567890cdab12
                      key: inngest-event-key-prod-abc123
                      name: Production Event Key
                    - createdAt: '2024-01-18T14:22:33Z'
                      environment: staging
                      id: e5f6a7b8-c9d0-4123-efa5-67890dbc1234
                      key: inngest-event-key-stage-def456
                      name: Staging Event Key
                    metadata:
                      cachedUntil: null
                      fetchedAt: '2024-01-20T14:22:33Z'
                    page:
                      cursor: 01K3SB60E36ZMPEV43BG0H20MW
                      hasMore: true
                      limit: 20
              schema:
                $ref: '#/components/schemas/v2FetchAccountEventKeysResponse'
          description: List of account event keys
        '400':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors:
                    - code: invalid_field_format
                      message: Limit must be at least 1
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Bad Request - invalid query parameters
        '401':
          content:
            application/json:
              examples:
                default:
                  value: Authentication failed
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Unauthorized - authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Forbidden - insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Not Found - account not found
        '500':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors:
                    - code: internal_error
                      message: Something went wrong
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List account event keys
      tags:
      - Keys
  /keys/signing:
    get:
      description: Lists signing keys for a specific account, optionally filtered by environment. If the environment header isn't specified, this returns the default production environment's keys.
      operationId: V2_FetchAccountSigningKeys
      parameters:
      - description: Pagination cursor from previous response
        in: query
        name: cursor
        schema:
          type: string
      - description: 'Number of signing keys to return per page (min: 1, max: 100)'
        in: query
        name: limit
        schema:
          default: '20'
          format: int32
          type: integer
      - description: Filter signing keys by environment (e.g., 'production', 'staging', 'development')
        in: header
        name: X-Inngest-Env
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                    - createdAt: '2024-01-15T10:30:00Z'
                      environment: production
                      id: f6a7b8c9-d0e1-4234-fab6-7890ecd23456
                      key: signkey-prod-abc123def456
                      name: ''
                    metadata:
                      cachedUntil: null
                      fetchedAt: '2024-01-20T14:22:33Z'
                    page:
                      cursor: null
                      hasMore: false
                      limit: 20
              schema:
                $ref: '#/components/schemas/v2FetchAccountSigningKeysResponse'
          description: List of account signing keys
        '400':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors:
                    - code: invalid_field_format
                      message: Limit must be at least 1
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Bad Request - invalid query parameters
        '401':
          content:
            application/json:
              examples:
                default:
                  value: Authentication failed
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Unauthorized - authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Forbidden - insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Not Found - account not found
        '500':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors:
                    - code: internal_error
                      message: Something went wrong
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List account signing keys
      tags:
      - Keys
components:
  schemas:
    v2ErrorResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/v2Error'
          type: array
      type: object
    v2FetchAccountEventKeysResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/v2EventKey'
          type: array
        metadata:
          $ref: '#/components/schemas/v2ResponseMetadata'
        page:
          $ref: '#/components/schemas/v2Page'
      type: object
    v2ResponseMetadata:
      properties:
        cachedUntil:
          format: date-time
          type: string
        fetchedAt:
          format: date-time
          type: string
        timeRange:
          $ref: '#/components/schemas/v2TimeRange'
      type: object
    v2Error:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    v2Page:
      properties:
        cursor:
          type: string
        hasMore:
          type: boolean
        limit:
          format: int32
          type: integer
      type: object
    v2TimeRange:
      properties:
        from:
          format: date-time
          type: string
        until:
          format: date-time
          type: string
      type: object
    v2FetchAccountSigningKeysResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/v2SigningKey'
          type: array
        metadata:
          $ref: '#/components/schemas/v2ResponseMetadata'
        page:
          $ref: '#/components/schemas/v2Page'
      type: object
    v2EventKey:
      properties:
        createdAt:
          format: date-time
          type: string
        environment:
          type: string
        id:
          type: string
        key:
          type: string
        name:
          type: string
      type: object
    v2SigningKey:
      properties:
        createdAt:
          format: date-time
          type: string
        environment:
          type: string
        id:
          type: string
        key:
          type: string
        name:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Bearer token authentication. Format: `Bearer {key}`'
      in: header
      name: Authorization
      type: apiKey
x-provenance:
  method: harvested
  publisher: Inngest
  source: https://api-docs.inngest.com/api-specs/v2.json
