openapi: 3.2.0
info:
  description: The v2 API delivers a significantly improved developer experience with consistent design patterns and enhanced functionality.
  title: Inngest REST API v2 Events API
  version: 2.0.0
servers:
- description: Production server
  url: https://api.inngest.com/v2
- description: Development server
  url: http://localhost:8288/api/v2
tags:
- description: Send events
  name: Events
paths:
  /events:
    post:
      description: Sends one event for testing and debugging. The request accepts the name, data, user, id, and ts fields; send batches and other Event API fields through an Inngest SDK or the Event API. This endpoint uses REST API rate limits and is not intended for high-volume ingestion. Use the returned event ID with the event runs endpoint to inspect any function runs triggered by the event.
      operationId: V2_SendEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2SendEventRequest'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      eventId: 01K1QQ3VQ8R3M8QX4D51J8G7XH
                    metadata:
                      fetchedAt: '2026-08-06T16:00:00Z'
              schema:
                $ref: '#/components/schemas/v2SendEventResponse'
          description: Event accepted
        '400':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors:
                    - code: validation_error
                      message: timestamp is before Jan 1, 1980
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Bad Request - invalid event data
        '401':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors:
                    - code: authorization_header_missing
                      message: authorization header missing or invalid
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Unauthorized - authentication required
        '403':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors:
                    - code: access_denied
                      message: Cannot send events to an archived environment
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Forbidden - events cannot be sent to the selected environment
        '413':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors:
                    - code: invalid_request
                      message: Request body cannot exceed 3145728 bytes
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Payload Too Large - request body exceeds the endpoint limit
        '429':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors:
                    - code: rate_limited
                      message: API rate limit exceeded. The request was rejected and no event was sent.
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Too Many Requests - API rate limit exceeded. The request was rejected and no event was sent.
        '500':
          content:
            application/json:
              examples:
                default:
                  value:
                    errors:
                    - code: internal_error
                      message: Unable to send event
              schema:
                $ref: '#/components/schemas/v2ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Send event
      tags:
      - Events
components:
  schemas:
    v2ErrorResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/v2Error'
          type: array
      type: object
    v2SendEventRequest:
      properties:
        data:
          description: JSON object containing event data
          example:
            userId: 01H08WQHKQ9H8S7F7NQGQ0M1NZ
          type: object
        id:
          description: Optional event ID used for idempotency when scheduling function runs
          example: user-created-01H08WQHKQ9H8S7F7NQGQ0M1NZ
          type: string
        name:
          description: Event name
          example: app/user.created
          type: string
        ts:
          description: Optional event timestamp as Unix time in milliseconds. Defaults to the current time.
          example: 1754496000000
          format: int64
          type: string
        user:
          description: Deprecated user data. Put user data in the data field instead.
          example:
            email: ada@example.com
            id: 01H08WQHKQ9H8S7F7NQGQ0M1NZ
          type: object
      required:
      - name
      type: object
    v2SendEventData:
      properties:
        eventId:
          description: Internal event ID assigned by Inngest
          example: 01K1QQ3VQ8R3M8QX4D51J8G7XH
          type: string
      type: object
    v2ResponseMetadata:
      properties:
        cachedUntil:
          format: date-time
          type: string
        fetchedAt:
          format: date-time
          type: string
        timeRange:
          $ref: '#/components/schemas/v2TimeRange'
      type: object
    v2SendEventResponse:
      properties:
        data:
          $ref: '#/components/schemas/v2SendEventData'
        metadata:
          $ref: '#/components/schemas/v2ResponseMetadata'
      type: object
    v2Error:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    v2TimeRange:
      properties:
        from:
          format: date-time
          type: string
        until:
          format: date-time
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Bearer token authentication. Format: `Bearer {key}`'
      in: header
      name: Authorization
      type: apiKey
x-provenance:
  method: harvested
  publisher: Inngest
  source: https://api-docs.inngest.com/api-specs/v2.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
