naftiko: 1.0.0-alpha2
info:
  label: Inngest REST API — Events
  description: 'Inngest Events. Ingest events into the Inngest platform with /e/{eventKey} (alias inn.gs) and inspect them via /v1/events. Self-contained Naftiko capability covering one Inngest business surface.'
  tags:
  - Inngest
  - Events
  - Event-Driven
  - Durable Execution
  created: '2026-03-03'
  modified: '2026-05-22'
binds:
- namespace: env
  keys:
    INNGEST_SIGNING_KEY: INNGEST_SIGNING_KEY
    INNGEST_EVENT_KEY: INNGEST_EVENT_KEY
capability:
  consumes:
  - type: http
    namespace: inngest-events
    baseUri: https://api.inngest.com
    description: Inngest Events. Send and inspect events across the Inngest event-driven durable execution platform.
    resources:
    - name: e-eventKey
      path: /e/{eventKey}
      operations:
      - name: sendEvents
        method: POST
        description: Send one or more events to Inngest (up to 512 KB total payload).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: eventKey
          in: path
          type: string
          description: Environment-specific Inngest event key.
          required: true
        - name: x-inngest-env
          in: header
          type: string
          description: Optional branch environment to target.
        - name: body
          in: body
          type: object
          description: A single Event object or an array of Event objects.
          required: true
    - name: v1-events
      path: /v1/events
      operations:
      - name: listEvents
        method: GET
        description: List recent events received in the current environment.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: Filter events by event name.
        - name: limit
          in: query
          type: integer
    - name: v1-events-eventId
      path: /v1/events/{eventId}
      operations:
      - name: getEvent
        method: GET
        description: Get an event by ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: eventId
          in: path
          type: string
          required: true
    - name: v1-events-eventId-runs
      path: /v1/events/{eventId}/runs
      operations:
      - name: listEventRuns
        method: GET
        description: List runs triggered by an event.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: eventId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.INNGEST_SIGNING_KEY}}'
  exposes:
  - type: rest
    namespace: inngest-events-rest
    port: 8080
    description: REST adapter for Inngest Events. Spectral-compliant resources per consumed operation under /v1.
    resources:
    - path: /v1/events-ingest/{eventkey}
      name: events-ingest
      description: Ingest events via the Inngest /e/{eventKey} endpoint.
      operations:
      - method: POST
        name: sendEvents
        description: Send one or more events to Inngest.
        call: inngest-events.sendEvents
        with:
          eventKey: rest.eventKey
          x-inngest-env: rest.x-inngest-env
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events
      name: events
      description: List recent events.
      operations:
      - method: GET
        name: listEvents
        description: List recent events.
        call: inngest-events.listEvents
        with:
          name: rest.name
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/{eventid}
      name: events-event
      description: Get a single event.
      operations:
      - method: GET
        name: getEvent
        description: Get an event by ID.
        call: inngest-events.getEvent
        with:
          eventId: rest.eventId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/{eventid}/runs
      name: events-runs
      description: List runs triggered by an event.
      operations:
      - method: GET
        name: listEventRuns
        description: List runs triggered by an event.
        call: inngest-events.listEventRuns
        with:
          eventId: rest.eventId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: inngest-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Inngest Events. One tool per consumed operation.
    tools:
    - name: send-events
      description: Send one or more events to Inngest.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: inngest-events.sendEvents
      with:
        eventKey: tools.eventKey
        x-inngest-env: tools.x-inngest-env
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-events
      description: List recent events.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-events.listEvents
      with:
        name: tools.name
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-event
      description: Get an event by ID.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-events.getEvent
      with:
        eventId: tools.eventId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-event-runs
      description: List runs triggered by an event.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-events.listEventRuns
      with:
        eventId: tools.eventId
      outputParameters:
      - type: object
        mapping: $.
