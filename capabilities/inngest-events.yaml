naftiko: 1.0.0-alpha2
info:
  label: Inngest REST API — Events
  description: 'Inngest REST API — Events. 4 operations. Lead operation: Send event(s) to Inngest. Self-contained Naftiko
    capability covering one Inngest business surface.'
  tags:
  - Inngest
  - Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    INNGEST_API_KEY: INNGEST_API_KEY
capability:
  consumes:
  - type: http
    namespace: inngest-events
    baseUri: https://api.inngest.com
    description: Inngest REST API — Events business capability. Self-contained, no shared references.
    resources:
    - name: e-eventKey
      path: /e/{eventKey}
      operations:
      - name: sendevents
        method: POST
        description: Send event(s) to Inngest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: eventKey
          in: path
          type: string
          description: Your environment-specific Inngest event key.
          required: true
        - name: x-inngest-env
          in: header
          type: string
          description: Branch environment to target.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-events
      path: /v1/events
      operations:
      - name: listevents
        method: GET
        description: List recent events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: Filter events by event name.
        - name: limit
          in: query
          type: integer
    - name: v1-events-eventId
      path: /v1/events/{eventId}
      operations:
      - name: getevent
        method: GET
        description: Get an event by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: eventId
          in: path
          type: string
          required: true
    - name: v1-events-eventId-runs
      path: /v1/events/{eventId}/runs
      operations:
      - name: listeventruns
        method: GET
        description: List runs triggered by an event
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: eventId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.INNGEST_API_KEY}}'
  exposes:
  - type: rest
    namespace: inngest-events-rest
    port: 8080
    description: REST adapter for Inngest REST API — Events. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/e/{eventkey}
      name: e-eventkey
      description: REST surface for e-eventKey.
      operations:
      - method: POST
        name: sendevents
        description: Send event(s) to Inngest
        call: inngest-events.sendevents
        with:
          eventKey: rest.eventKey
          x-inngest-env: rest.x-inngest-env
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/events
      name: v1-events
      description: REST surface for v1-events.
      operations:
      - method: GET
        name: listevents
        description: List recent events
        call: inngest-events.listevents
        with:
          name: rest.name
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/events/{eventid}
      name: v1-events-eventid
      description: REST surface for v1-events-eventId.
      operations:
      - method: GET
        name: getevent
        description: Get an event by ID
        call: inngest-events.getevent
        with:
          eventId: rest.eventId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/events/{eventid}/runs
      name: v1-events-eventid-runs
      description: REST surface for v1-events-eventId-runs.
      operations:
      - method: GET
        name: listeventruns
        description: List runs triggered by an event
        call: inngest-events.listeventruns
        with:
          eventId: rest.eventId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: inngest-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Inngest REST API — Events. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: send-event-s-inngest
      description: Send event(s) to Inngest
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: inngest-events.sendevents
      with:
        eventKey: tools.eventKey
        x-inngest-env: tools.x-inngest-env
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-recent-events
      description: List recent events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-events.listevents
      with:
        name: tools.name
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-event-id
      description: Get an event by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-events.getevent
      with:
        eventId: tools.eventId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-runs-triggered-event
      description: List runs triggered by an event
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-events.listeventruns
      with:
        eventId: tools.eventId
      outputParameters:
      - type: object
        mapping: $.
