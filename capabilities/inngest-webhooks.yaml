naftiko: 1.0.0-alpha2
info:
  label: Inngest REST API — Webhooks
  description: 'Inngest Webhooks. List and create inbound webhooks that translate third-party HTTP payloads into Inngest events via a configurable JavaScript transform.'
  tags:
  - Inngest
  - Webhooks
  - Event-Driven
  - Integration
  created: '2026-05-22'
  modified: '2026-05-22'
binds:
- namespace: env
  keys:
    INNGEST_SIGNING_KEY: INNGEST_SIGNING_KEY
capability:
  consumes:
  - type: http
    namespace: inngest-webhooks
    baseUri: https://api.inngest.com/v2
    description: Inngest Webhooks management surface (v2).
    resources:
    - name: env-webhooks
      path: /env/webhooks
      operations:
      - name: v2ListWebhooks
        method: GET
        description: List webhooks in the current environment.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: v2CreateWebhook
        method: POST
        description: Create a new webhook for receiving events.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: bearer
      token: '{{env.INNGEST_SIGNING_KEY}}'
  exposes:
  - type: rest
    namespace: inngest-webhooks-rest
    port: 8080
    description: REST adapter for Inngest Webhooks.
    resources:
    - path: /v1/webhooks
      name: webhooks
      description: List and create inbound webhooks.
      operations:
      - method: GET
        name: v2ListWebhooks
        description: List webhooks.
        call: inngest-webhooks.v2ListWebhooks
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: v2CreateWebhook
        description: Create a webhook.
        call: inngest-webhooks.v2CreateWebhook
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: inngest-webhooks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Inngest Webhooks.
    tools:
    - name: list-webhooks
      description: List inbound webhooks in the current environment.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-webhooks.v2ListWebhooks
      outputParameters:
      - type: object
        mapping: $.
    - name: create-webhook
      description: Create a new inbound webhook with a JavaScript transform.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: inngest-webhooks.v2CreateWebhook
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
