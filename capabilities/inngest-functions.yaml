naftiko: 1.0.0-alpha2
info:
  label: Inngest REST API — Functions
  description: 'Inngest Functions. List deployed functions and invoke them (v2). Self-contained Naftiko capability covering Inngest function discovery and on-demand invocation.'
  tags:
  - Inngest
  - Functions
  - Durable Execution
  - AI Agents
  created: '2026-03-03'
  modified: '2026-05-22'
binds:
- namespace: env
  keys:
    INNGEST_SIGNING_KEY: INNGEST_SIGNING_KEY
capability:
  consumes:
  - type: http
    namespace: inngest-functions
    baseUri: https://api.inngest.com
    description: Inngest Functions business capability covering list and invoke surfaces.
    resources:
    - name: v1-functions
      path: /v1/functions
      operations:
      - name: listFunctions
        method: GET
        description: List deployed functions.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v2-invoke
      path: /v2/apps/{appId}/functions/{functionId}/invoke
      operations:
      - name: v2InvokeFunction
        method: POST
        description: Invoke a deployed Inngest function asynchronously or synchronously.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
        - name: functionId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: bearer
      token: '{{env.INNGEST_SIGNING_KEY}}'
  exposes:
  - type: rest
    namespace: inngest-functions-rest
    port: 8080
    description: REST adapter for Inngest Functions.
    resources:
    - path: /v1/functions
      name: functions
      description: REST surface for listing functions.
      operations:
      - method: GET
        name: listFunctions
        description: List deployed functions.
        call: inngest-functions.listFunctions
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apps/{appid}/functions/{functionid}/invoke
      name: function-invoke
      description: REST surface for invoking a deployed function.
      operations:
      - method: POST
        name: v2InvokeFunction
        description: Invoke a deployed Inngest function.
        call: inngest-functions.v2InvokeFunction
        with:
          appId: rest.appId
          functionId: rest.functionId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: inngest-functions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Inngest Functions.
    tools:
    - name: list-functions
      description: List deployed functions.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-functions.listFunctions
      outputParameters:
      - type: object
        mapping: $.
    - name: invoke-function
      description: Invoke a deployed Inngest function.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: inngest-functions.v2InvokeFunction
      with:
        appId: tools.appId
        functionId: tools.functionId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
