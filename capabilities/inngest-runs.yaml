naftiko: 1.0.0-alpha2
info:
  label: Inngest REST API — Runs
  description: 'Inngest Runs. Inspect, cancel, and trace function runs across v1 (jobs, cancel) and v2 (canonical run summary, trace tree). Self-contained Naftiko capability.'
  tags:
  - Inngest
  - Runs
  - Durable Execution
  - Observability
  created: '2026-03-03'
  modified: '2026-05-22'
binds:
- namespace: env
  keys:
    INNGEST_SIGNING_KEY: INNGEST_SIGNING_KEY
capability:
  consumes:
  - type: http
    namespace: inngest-runs
    baseUri: https://api.inngest.com
    description: Inngest Runs business capability covering v1 jobs/cancel and v2 run + trace endpoints.
    resources:
    - name: v1-runs-runId
      path: /v1/runs/{runId}
      operations:
      - name: getRun
        method: GET
        description: Get function run status.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: runId
          in: path
          type: string
          required: true
    - name: v1-runs-runId-cancel
      path: /v1/runs/{runId}/cancel
      operations:
      - name: cancelRun
        method: POST
        description: Cancel a function run.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: runId
          in: path
          type: string
          required: true
    - name: v1-runs-runId-jobs
      path: /v1/runs/{runId}/jobs
      operations:
      - name: listRunJobs
        method: GET
        description: List the jobs (steps) for a run.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: runId
          in: path
          type: string
          required: true
    - name: v2-runs-runId
      path: /v2/runs/{runId}
      operations:
      - name: v2GetFunctionRun
        method: GET
        description: Get canonical run summary (v2, Beta).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: runId
          in: path
          type: string
          required: true
    - name: v2-runs-runId-trace
      path: /v2/runs/{runId}/trace
      operations:
      - name: v2GetFunctionTrace
        method: GET
        description: Get function trace tree for a single run (v2, Beta).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: runId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.INNGEST_SIGNING_KEY}}'
  exposes:
  - type: rest
    namespace: inngest-runs-rest
    port: 8080
    description: REST adapter for Inngest Runs.
    resources:
    - path: /v1/runs/{runid}
      name: runs-run
      description: REST surface for a single function run.
      operations:
      - method: GET
        name: getRun
        description: Get function run status.
        call: inngest-runs.getRun
        with:
          runId: rest.runId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/runs/{runid}/cancel
      name: runs-run-cancel
      description: REST surface for cancelling a run.
      operations:
      - method: POST
        name: cancelRun
        description: Cancel a function run.
        call: inngest-runs.cancelRun
        with:
          runId: rest.runId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/runs/{runid}/jobs
      name: runs-run-jobs
      description: REST surface for listing step jobs for a run.
      operations:
      - method: GET
        name: listRunJobs
        description: List the jobs (steps) for a run.
        call: inngest-runs.listRunJobs
        with:
          runId: rest.runId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v2/runs/{runid}
      name: v2-runs-run
      description: REST surface for v2 canonical run summary.
      operations:
      - method: GET
        name: v2GetFunctionRun
        description: Get canonical run summary.
        call: inngest-runs.v2GetFunctionRun
        with:
          runId: rest.runId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v2/runs/{runid}/trace
      name: v2-runs-run-trace
      description: REST surface for v2 run trace tree.
      operations:
      - method: GET
        name: v2GetFunctionTrace
        description: Get function trace tree for a run.
        call: inngest-runs.v2GetFunctionTrace
        with:
          runId: rest.runId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: inngest-runs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Inngest Runs.
    tools:
    - name: get-run
      description: Get function run status (v1).
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-runs.getRun
      with:
        runId: tools.runId
      outputParameters:
      - type: object
        mapping: $.
    - name: cancel-run
      description: Cancel a function run.
      hints:
        readOnly: false
        destructive: true
        idempotent: false
      call: inngest-runs.cancelRun
      with:
        runId: tools.runId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-run-jobs
      description: List the jobs (steps) for a run.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-runs.listRunJobs
      with:
        runId: tools.runId
      outputParameters:
      - type: object
        mapping: $.
    - name: v2-get-function-run
      description: Get canonical run summary (v2, Beta).
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-runs.v2GetFunctionRun
      with:
        runId: tools.runId
      outputParameters:
      - type: object
        mapping: $.
    - name: v2-get-function-trace
      description: Get function trace tree for a run.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-runs.v2GetFunctionTrace
      with:
        runId: tools.runId
      outputParameters:
      - type: object
        mapping: $.
