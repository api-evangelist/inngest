naftiko: 1.0.0-alpha2
info:
  label: Inngest REST API — Environments
  description: 'Inngest Environments. List, create, and update branch and custom environments used to isolate Inngest traffic across development, staging, branch, and production.'
  tags:
  - Inngest
  - Environments
  - Branches
  - Platform
  created: '2026-05-22'
  modified: '2026-05-22'
binds:
- namespace: env
  keys:
    INNGEST_SIGNING_KEY: INNGEST_SIGNING_KEY
capability:
  consumes:
  - type: http
    namespace: inngest-environments
    baseUri: https://api.inngest.com/v2
    description: Inngest Environments management surface (v2).
    resources:
    - name: envs
      path: /envs
      operations:
      - name: v2FetchAccountEnvs
        method: GET
        description: List custom and branch environments for the account.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: v2CreateEnv
        method: POST
        description: Create a custom or branch environment.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: envs-id
      path: /envs/{id}
      operations:
      - name: v2PatchEnv
        method: PATCH
        description: Partially update an environment.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: bearer
      token: '{{env.INNGEST_SIGNING_KEY}}'
  exposes:
  - type: rest
    namespace: inngest-environments-rest
    port: 8080
    description: REST adapter for Inngest Environments.
    resources:
    - path: /v1/environments
      name: environments
      description: List and create Inngest environments.
      operations:
      - method: GET
        name: v2FetchAccountEnvs
        description: List environments.
        call: inngest-environments.v2FetchAccountEnvs
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: v2CreateEnv
        description: Create an environment.
        call: inngest-environments.v2CreateEnv
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/environments/{id}
      name: environment
      description: Update a single environment.
      operations:
      - method: PATCH
        name: v2PatchEnv
        description: Update an environment.
        call: inngest-environments.v2PatchEnv
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: inngest-environments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Inngest Environments.
    tools:
    - name: list-environments
      description: List Inngest environments.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest-environments.v2FetchAccountEnvs
      outputParameters:
      - type: object
        mapping: $.
    - name: create-environment
      description: Create an Inngest environment.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: inngest-environments.v2CreateEnv
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: update-environment
      description: Update an Inngest environment.
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: inngest-environments.v2PatchEnv
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
