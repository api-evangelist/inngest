naftiko: 1.0.0-alpha2
info:
  label: Inngest REST API
  description: The Inngest REST API provides programmatic access to manage and interact with Inngest resources including events,
    functions, and runs. It enables developers to send events to trigger functions, fetch run status and output, and inspect
    function activity for event-driven, background, and durable workflows.
  tags:
  - Inngest
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: inngest
    baseUri: https://api.inngest.com
    description: Inngest REST API HTTP API.
    authentication:
      type: bearer
      token: '{{INNGEST_TOKEN}}'
    resources:
    - name: e-eventkey
      path: /e/{eventKey}
      operations:
      - name: sendevents
        method: POST
        description: Send event(s) to Inngest
        inputParameters:
        - name: eventKey
          in: path
          type: string
          required: true
          description: Your environment-specific Inngest event key.
        - name: x-inngest-env
          in: header
          type: string
          description: Branch environment to target.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-events
      path: /v1/events
      operations:
      - name: listevents
        method: GET
        description: List recent events
        inputParameters:
        - name: name
          in: query
          type: string
          description: Filter events by event name.
        - name: limit
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-events-eventid
      path: /v1/events/{eventId}
      operations:
      - name: getevent
        method: GET
        description: Get an event by ID
        inputParameters:
        - name: eventId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-events-eventid-runs
      path: /v1/events/{eventId}/runs
      operations:
      - name: listeventruns
        method: GET
        description: List runs triggered by an event
        inputParameters:
        - name: eventId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-runs-runid
      path: /v1/runs/{runId}
      operations:
      - name: getrun
        method: GET
        description: Get function run status
        inputParameters:
        - name: runId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-runs-runid-jobs
      path: /v1/runs/{runId}/jobs
      operations:
      - name: listrunjobs
        method: GET
        description: List the jobs (steps) for a run
        inputParameters:
        - name: runId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-runs-runid-cancel
      path: /v1/runs/{runId}/cancel
      operations:
      - name: cancelrun
        method: POST
        description: Cancel a function run
        inputParameters:
        - name: runId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-functions
      path: /v1/functions
      operations:
      - name: listfunctions
        method: GET
        description: List functions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: inngest-rest
    description: REST adapter for Inngest REST API.
    resources:
    - path: /e/{eventKey}
      name: sendevents
      operations:
      - method: POST
        name: sendevents
        description: Send event(s) to Inngest
        call: inngest.sendevents
        with:
          eventKey: rest.eventKey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events
      name: listevents
      operations:
      - method: GET
        name: listevents
        description: List recent events
        call: inngest.listevents
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/{eventId}
      name: getevent
      operations:
      - method: GET
        name: getevent
        description: Get an event by ID
        call: inngest.getevent
        with:
          eventId: rest.eventId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/{eventId}/runs
      name: listeventruns
      operations:
      - method: GET
        name: listeventruns
        description: List runs triggered by an event
        call: inngest.listeventruns
        with:
          eventId: rest.eventId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/runs/{runId}
      name: getrun
      operations:
      - method: GET
        name: getrun
        description: Get function run status
        call: inngest.getrun
        with:
          runId: rest.runId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/runs/{runId}/jobs
      name: listrunjobs
      operations:
      - method: GET
        name: listrunjobs
        description: List the jobs (steps) for a run
        call: inngest.listrunjobs
        with:
          runId: rest.runId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/runs/{runId}/cancel
      name: cancelrun
      operations:
      - method: POST
        name: cancelrun
        description: Cancel a function run
        call: inngest.cancelrun
        with:
          runId: rest.runId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/functions
      name: listfunctions
      operations:
      - method: GET
        name: listfunctions
        description: List functions
        call: inngest.listfunctions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: inngest-mcp
    transport: http
    description: MCP adapter for Inngest REST API for AI agent use.
    tools:
    - name: sendevents
      description: Send event(s) to Inngest
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: inngest.sendevents
      with:
        eventKey: tools.eventKey
      inputParameters:
      - name: eventKey
        type: string
        description: Your environment-specific Inngest event key.
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listevents
      description: List recent events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest.listevents
      with:
        name: tools.name
        limit: tools.limit
      inputParameters:
      - name: name
        type: string
        description: Filter events by event name.
      - name: limit
        type: integer
        description: limit
      outputParameters:
      - type: object
        mapping: $.
    - name: getevent
      description: Get an event by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest.getevent
      with:
        eventId: tools.eventId
      inputParameters:
      - name: eventId
        type: string
        description: eventId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listeventruns
      description: List runs triggered by an event
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest.listeventruns
      with:
        eventId: tools.eventId
      inputParameters:
      - name: eventId
        type: string
        description: eventId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getrun
      description: Get function run status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest.getrun
      with:
        runId: tools.runId
      inputParameters:
      - name: runId
        type: string
        description: runId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listrunjobs
      description: List the jobs (steps) for a run
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest.listrunjobs
      with:
        runId: tools.runId
      inputParameters:
      - name: runId
        type: string
        description: runId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: cancelrun
      description: Cancel a function run
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: inngest.cancelrun
      with:
        runId: tools.runId
      inputParameters:
      - name: runId
        type: string
        description: runId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listfunctions
      description: List functions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inngest.listfunctions
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    INNGEST_TOKEN: INNGEST_TOKEN
