specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Inngest
providerId: inngest
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-22'
tags:
  - AI Agents
  - Background Jobs
  - Cron Jobs
  - Durable Execution
  - Event-Driven
  - Orchestration
  - Queues
  - Serverless
  - Step Functions
  - Workflows
  - Rate Limiting
  - Quotas
  - Throttling
  - Concurrency
description: >-
  Rate limit definitions for the Inngest API surface. Inngest's primary
  consumer-facing limits are execution volume and concurrent steps per plan
  tier, plus a 512 KB event ingestion payload ceiling and platform-level
  fair-share scheduling. Function-level concurrency, throttling, batching,
  debounce, and rate limiting are configured per function via the SDK.
headers:
  retryAfter: Retry-After
responseCodes:
  payloadTooLarge: 413
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
  - tier: platform
    name: Event Ingestion Payload Limit
    scope: request
    metric: payload_bytes
    limit: 524288
    timeFrame: request
    applies:
      - Inngest Events API
  - tier: platform
    name: Platform Capacity Ceiling
    scope: platform
    metric: executions_per_second
    limit: 100000
    timeFrame: second
    applies:
      - Inngest REST API
  - tier: hobby
    name: Hobby Monthly Executions
    scope: account
    metric: executions_per_month
    limit: 50000
    timeFrame: month
    applies:
      - Inngest REST API
  - tier: hobby
    name: Hobby Concurrent Steps
    scope: account
    metric: concurrent_steps
    limit: 5
    timeFrame: instant
    applies:
      - Inngest REST API
  - tier: pro
    name: Pro Included Executions
    scope: account
    metric: executions_per_month
    limit: 1000000
    timeFrame: month
    applies:
      - Inngest REST API
  - tier: pro
    name: Pro Add-On Execution Ceiling
    scope: account
    metric: executions_per_month
    limit: 20000000
    timeFrame: month
    applies:
      - Inngest REST API
  - tier: pro
    name: Pro Concurrent Steps Baseline
    scope: account
    metric: concurrent_steps
    limit: 100
    timeFrame: instant
    applies:
      - Inngest REST API
  - tier: enterprise
    name: Enterprise Concurrent Steps Ceiling
    scope: contract
    metric: concurrent_steps
    limit: 50000
    timeFrame: instant
    applies:
      - Inngest REST API
functionLevelControls:
  - name: concurrency
    description: Limit how many runs of a function execute simultaneously, keyed by event data.
  - name: throttle
    description: Pace a function to a maximum rate per window.
  - name: rateLimit
    description: Drop or queue events past a per-function rate limit.
  - name: batching
    description: Aggregate events into batches before invoking the function.
  - name: debounce
    description: Collapse rapid event bursts into a single run.
  - name: priority
    description: Schedule higher-priority runs ahead of lower-priority within fair-share queues.
  - name: singleton
    description: Enforce exclusive execution of a function keyed by event data.
policies:
  - name: Multitenant Fair Queue
    description: >-
      The Inngest runner uses a multitenant-aware, multitier queue designed for
      fairness so noisy neighbors cannot starve other tenants.
  - name: Backoff Strategy
    description: >-
      Clients should implement exponential backoff with jitter, honoring the
      Retry-After header when present.
  - name: Quota Reset
    description: >-
      Monthly execution quotas reset at the start of each calendar month
      in UTC.
  - name: Fair Use
    description: >-
      Even on uncapped Enterprise contracts, sustained usage that materially
      impacts shared infrastructure may be subject to fair-use throttling.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
